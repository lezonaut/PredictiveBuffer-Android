name: Build Android64 Geode mod

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Build Android64
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Android64
          path: .
      - name: Upload compiled Geode package
        uses: actions/upload-artifact@v4
        with:
          name: PredictiveBuffer-Android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
